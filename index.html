<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TCloud</title>
  <style>
    html,body,#root{margin:0;width:100%;height:100%;overflow:hidden;background:#090d18;color:#f7f7f5;font-family:"Segoe UI Variable","Segoe UI",Arial,sans-serif}
    #tcloud-boot-fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#090d18;z-index:2147483647}
    .tcloud-boot-card{width:min(420px,calc(100vw - 48px));text-align:center;padding:28px}
    .tcloud-boot-logo{width:54px;height:54px;margin-bottom:16px}
    .tcloud-boot-card strong{display:block;font-size:18px;margin-bottom:8px}
    .tcloud-boot-card p{margin:0;color:#b2b3ba;font-size:13px;line-height:1.5}
    .tcloud-boot-progress{height:3px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.08);margin:20px auto 0}
    .tcloud-boot-progress i{display:block;width:36%;height:100%;background:#7c5cff;animation:tcloud-boot 1.2s ease-in-out infinite}
    .tcloud-boot-detail{display:none;margin-top:16px;padding:10px;text-align:left;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto;border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#ffadb3;background:rgba(239,106,114,.08);font:11px/1.45 Consolas,monospace}
    .tcloud-boot-failed .tcloud-boot-progress{display:none}.tcloud-boot-failed .tcloud-boot-detail{display:block}
    @keyframes tcloud-boot{0%{transform:translateX(-130%)}50%{transform:translateX(90%)}100%{transform:translateX(300%)}}
  </style>
</head>

<body>
  <div id="root"></div>
  <div id="tcloud-boot-fallback" aria-live="polite">
    <section class="tcloud-boot-card">
      <img class="tcloud-boot-logo" src="/logo.svg" alt="" />
      <strong data-boot-title>Carregando TCloud</strong>
      <p data-boot-message>Preparando sua nuvem pessoal…</p>
      <div class="tcloud-boot-progress" aria-hidden="true"><i></i></div>
      <pre class="tcloud-boot-detail" data-boot-detail></pre>
    </section>
  </div>
  <script>
    window.__TCLOUD_BOOT_OK__ = false;
    window.addEventListener('error', function (event) {
      if (window.__TCLOUD_BOOT_OK__) return;
      var el = document.getElementById('tcloud-boot-fallback');
      if (!el) return;
      el.classList.add('tcloud-boot-failed');
      var title = el.querySelector('[data-boot-title]');
      var message = el.querySelector('[data-boot-message]');
      var detail = el.querySelector('[data-boot-detail]');
      if (title) title.textContent = 'O TCloud não conseguiu carregar a interface';
      if (message) message.textContent = 'Falha ao carregar um módulo da interface.';
      if (detail) detail.textContent = event.message || 'Erro de carregamento sem detalhes.';
    }, true);
    setTimeout(function () {
      if (window.__TCLOUD_BOOT_OK__) return;
      var el = document.getElementById('tcloud-boot-fallback');
      if (!el || el.classList.contains('tcloud-boot-failed')) return;
      el.classList.add('tcloud-boot-failed');
      var title = el.querySelector('[data-boot-title]');
      var message = el.querySelector('[data-boot-message]');
      var detail = el.querySelector('[data-boot-detail]');
      if (title) title.textContent = 'A interface demorou mais que o esperado';
      if (message) message.textContent = 'O processo está ativo, mas o frontend não concluiu a inicialização.';
      if (detail) detail.textContent = 'Timeout de inicialização do frontend (10 s).';
    }, 10000);
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
